apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-config
  namespace: datalens
data:
  S3_BUCKET: "datalens-akamai-logs"
  S3_PREFIX: "logs/"
  S3_REGION: "us-east-1"
  S3_ENDPOINT: "s3.us-east-1.amazonaws.com"
  # Data partitioning pattern: s3://bucket/logs/YYYY/MM/DD/HH/
  S3_PARTITION_PATTERN: "logs/{year}/{month}/{day}/{hour}/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: akamai-schema-config
  namespace: datalens
data:
  log-format: "structured" # structured or delimited
  delimiter: " "
  field-order: |
    version,cp,reqId,reqTimeSec,streamId,edgeAttempts,deliveryPolicyReqStatus,
    deliveryPolicyId,arlid,bytes,cliIP,statusCode,proto,reqHost,reqMethod,
    reqPath,reqPort,rspContentLen,rspContentType,UA,tlsOverheadTimeMSec,
    tlsVersion,objSize,uncompressedSize,overheadBytes,queryStr,totalBytes,
    fileSizeBucket,downloadInitiated,downloadsCompleted,edgeIPBinding,
    tlsEarlyData,accLang,cookie,range,referer,xForwardedFor,maxAgeSec,
    reqEndTimeMSec,turnAroundTimeMSec,transferTimeMSec,errorCode,
    dnsLookupTimeMSec,lastByte,asn,timeToFirstByte,startupError,downloadTime,
    throughput,prefetchMidgressHits,cacheStatus,breadcrumbs,cacheable,country,
    city,state,edgeIP,serverCountry,billingRegion,securityRules,ewUsageInfo,
    ewExecutionInfo,cmcd,deliveryType,deliveryFormat,mediaEncryption,
    contentProtectionInfo,customField
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: datalens
data:
  KAFKA_BROKERS: "kafka-headless.datalens.svc.cluster.local:9092"
  KAFKA_TOPIC_RAW_LOGS: "akamai-raw-logs"
  KAFKA_TOPIC_PROCESSED_METRICS: "akamai-processed-metrics"
  KAFKA_TOPIC_ALERTS: "akamai-alerts"
  KAFKA_CONSUMER_GROUP: "datalens-processors"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-config
  namespace: datalens
data:
  TIMESCALE_HOST: "timescaledb.datalens.svc.cluster.local"
  TIMESCALE_PORT: "5432"
  TIMESCALE_DB: "datalens_metrics"
  TIMESCALE_USER: "datalens"

