apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: akamai-s3-processor
  namespace: datalens
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "datalens/spark-py:3.5.0"
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/spark/work-dir/s3_processor.py
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20
  driver:
    cores: 2
    coreLimit: "2000m"
    memory: "4g"
    labels:
      version: 3.5.0
      app: datalens-spark-driver
    serviceAccount: spark
    env:
      - name: S3_BUCKET
        valueFrom:
          configMapKeyRef:
            name: s3-config
            key: S3_BUCKET
      - name: S3_INPUT_PREFIX
        valueFrom:
          configMapKeyRef:
            name: s3-config
            key: S3_PREFIX
      - name: S3_REGION
        valueFrom:
          configMapKeyRef:
            name: s3-config
            key: S3_REGION
      - name: KAFKA_BROKERS
        valueFrom:
          configMapKeyRef:
            name: kafka-config
            key: KAFKA_BROKERS
      - name: KAFKA_TOPIC_RAW
        valueFrom:
          configMapKeyRef:
            name: kafka-config
            key: KAFKA_TOPIC_RAW_LOGS
      - name: TIMESCALE_HOST
        valueFrom:
          configMapKeyRef:
            name: timescaledb-config
            key: TIMESCALE_HOST
      - name: TIMESCALE_PORT
        valueFrom:
          configMapKeyRef:
            name: timescaledb-config
            key: TIMESCALE_PORT
      - name: TIMESCALE_DB
        valueFrom:
          configMapKeyRef:
            name: timescaledb-config
            key: TIMESCALE_DB
      - name: TIMESCALE_USER
        valueFrom:
          configMapKeyRef:
            name: timescaledb-config
            key: TIMESCALE_USER
      - name: TIMESCALE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: timescaledb-credentials
            key: password
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: aws-credentials
            key: access-key
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: aws-credentials
            key: secret-key
  executor:
    cores: 2
    instances: 4
    memory: "4g"
    labels:
      version: 3.5.0
      app: datalens-spark-executor
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: aws-credentials
            key: access-key
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: aws-credentials
            key: secret-key
  deps:
    jars:
      - https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar
      - https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar
      - https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.1/postgresql-42.7.1.jar
    packages:
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
  sparkConf:
    "spark.kubernetes.authenticate.driver.serviceAccountName": "spark"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.DefaultAWSCredentialsProviderChain"
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.parquet.compression.codec": "snappy"
    "spark.sql.shuffle.partitions": "200"
    "spark.dynamicAllocation.enabled": "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: datalens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: datalens
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: datalens
subjects:
- kind: ServiceAccount
  name: spark
  namespace: datalens
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io

